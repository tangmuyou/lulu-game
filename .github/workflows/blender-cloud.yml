name: Blender Cloud

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/blender-cloud.yml'
      - 'tools/blender/**'
      - 'vendor/**'
      - '.gitmodules'
      - '.agents/**'
      - 'AGENTS.md'

permissions:
  contents: read

concurrency:
  group: blender-cloud-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-asset:
    name: Build and validate Blender asset with installed skills
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BLENDER_VERSION: '4.5.14'
    steps:
      - name: Check out project and pinned skills
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Blender runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libxi6 libxrender1 libxfixes3 libxxf86vm1 libxkbcommon0 \
            libgl1 libegl1 libsm6 python3-pil

      - name: Verify installed skill revisions and licenses
        run: python3 tools/blender/skills_setup.py

      - name: Install pinned Khronos validator without install scripts
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm install --prefix "$RUNNER_TEMP/lulu-gltf-validator" \
            --ignore-scripts --no-audit --no-fund --save-exact gltf-validator@2.0.0-dev.3.10
          echo "GLTF_VALIDATOR_MODULE=$RUNNER_TEMP/lulu-gltf-validator/node_modules/gltf-validator" >> "$GITHUB_ENV"
          cp "$RUNNER_TEMP/lulu-gltf-validator/package-lock.json" artifacts/gltf-validator-package-lock.json
          mkdir -p artifacts/licenses
          find "$RUNNER_TEMP/lulu-gltf-validator/node_modules/gltf-validator" -maxdepth 1 -iname '*license*' -exec cp {} artifacts/licenses/ \;

      - name: Download and verify official Blender
        shell: bash
        run: |
          set -euo pipefail
          DOWNLOAD_DIR="$RUNNER_TEMP/blender-download"
          INSTALL_DIR="$RUNNER_TEMP/blender"
          mkdir -p "$DOWNLOAD_DIR" "$INSTALL_DIR"
          cd "$DOWNLOAD_DIR"
          ARCHIVE="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          CHECKSUMS="blender-${BLENDER_VERSION}.sha256"
          BASE_URL="https://download.blender.org/release/Blender4.5"
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 300 \
            "$BASE_URL/$ARCHIVE" -o "$ARCHIVE"
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 60 \
            "$BASE_URL/$CHECKSUMS" -o "$CHECKSUMS"
          sha256sum --check --ignore-missing "$CHECKSUMS"
          tar -xJf "$ARCHIVE" --strip-components=1 -C "$INSTALL_DIR"
          echo "$INSTALL_DIR" >> "$GITHUB_PATH"
          "$INSTALL_DIR/blender" --version

      - name: Build model, export GLB, reimport and render previews
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/logs
          blender --background --factory-startup --python-exit-code 1 \
            --python tools/blender/smoke_test.py -- --output artifacts \
            2>&1 | tee artifacts/logs/blender.log

      - name: Exercise installed skills and CPU roundtrip adapter
        shell: bash
        run: |
          set -euo pipefail
          blender --background --factory-startup --python-exit-code 1 \
            --python tools/blender/skills_qa.py -- --output artifacts \
            2>&1 | tee artifacts/logs/skills_qa.log

      - name: Validate real GLB and reject intentionally corrupt bytes
        run: node tools/blender/gltf_check.cjs artifacts/model/cloud_test_crate.glb artifacts

      - name: Check required outputs and nonempty previews
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          root = Path('artifacts')
          required = [
              'model/cloud_test_crate.glb', 'model/cloud_test_crate.blend',
              'textures/wood_basecolor.png', 'installed_blender_skills.zip',
              'preview/front.png', 'preview/back.png', 'preview/left.png', 'preview/right.png',
              'qa/roundtrip/roundtrip_clay_threequarter.png',
          ]
          for name in required:
              p = root / name
              if not p.is_file() or not p.stat().st_size:
                  raise SystemExit(f'Missing or empty output: {name}')
              if name.endswith('.png'):
                  with Image.open(p) as im:
                      if im.convert('RGBA').getchannel('A').getbbox() is None:
                          raise SystemExit(f'Fully transparent image: {name}')
          for name in ('validation.json', 'skills_installation.json', 'skills_qa.json', 'gltf_validation_summary.json'):
              data = json.loads((root / name).read_text())
              if data.get('status') != 'passed':
                  raise SystemExit(f'Validation did not pass: {name}')
          print('ALL_BLENDER_SKILL_INSTALLATION_CHECKS_PASSED')
          PY

      - name: Write task summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Blender cloud with pinned production skills'
            echo 'Test crate only; technical checks are not visual acceptance or Godot runtime tests.'
            echo 'The negative-scale and corrupt-GLB reports are intentional rejection tests.'
            for report in skills_installation skills_qa gltf_validation_summary; do
              if [ -f "artifacts/$report.json" ]; then
                echo "### $report"
                echo '```json'
                cat "artifacts/$report.json"
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload asset, installed skills, reports and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: blender-cloud-skills-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
